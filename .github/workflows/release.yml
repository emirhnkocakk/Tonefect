name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onedir --noconsole --name Grainline --icon assets/logo.ico server.py
      - name: Add web, fonts and config next to the exe
        shell: pwsh
        run: |
          Copy-Item web dist/Grainline/web -Recurse
          Copy-Item fonts dist/Grainline/fonts -Recurse
          Copy-Item brand.json dist/Grainline/brand.json
          Compress-Archive -Path dist/Grainline -DestinationPath Grainline-windows.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v1.0.${{ github.run_number }}" }
          gh release create $tag Grainline-windows.zip --target "${{ github.sha }}" --title "Grainline $tag" --notes "Windows: unzip, run Grainline.exe. / Windows: zip'i aç, Grainline.exe dosyasını çalıştır."
