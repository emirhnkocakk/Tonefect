name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          Set-Content -Path VERSION -Value $ver -NoNewline
          "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onedir --noconsole --name Grainline --icon assets/logo.ico server.py
      - name: Add web, fonts, version and config next to the exe
        shell: pwsh
        run: |
          Copy-Item web dist/Grainline/web -Recurse
          Copy-Item fonts dist/Grainline/fonts -Recurse
          Copy-Item brand.json dist/Grainline/brand.json
          Copy-Item VERSION dist/Grainline/VERSION
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer/grainline.iss
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag installer_out/Grainline-Setup.exe --target "${{ github.sha }}" --title "Grainline $tag" --notes-file RELEASE_NOTES.md
